[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "musecorder"
version = "0.2.0"
description = "Musecorder bridge: links the Musecorder ESP32 device to Meta Muse, Muse Code and your Mac, and relays applets"
requires-python = ">=3.10"
dependencies = [
  "muse-code-sdk>=1.4.13",
  "mcp>=1.10,<2",
  "openai>=1.50",
  "httpx>=0.27",
  "pyserial>=3.5",
  "websockets>=12",
  "cryptography>=42",
  "tomli>=2.0; python_version < '3.11'",
  "tomli-w>=1.0",
]

[project.optional-dependencies]
discovery = ["zeroconf>=0.130"]
ble = ["bleak>=0.22"]
stt = ["mlx-whisper>=0.4"]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
musecorder = "musecorder.cli:main"
musecorder-mcp = "musecorder.mcp_server:main"

[tool.setuptools.packages.find]
include = ["musecorder*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
